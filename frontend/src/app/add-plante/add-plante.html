<main class="form-page">
  <h1>Ajouter une plante</h1>
  @if (erreur) {
    <p class="error" role="alert">{{ erreur }}</p>
  }
  <form (ngSubmit)="ajouterPlante()">
    <label for="nom">Nom</label>
    <input id="nom" name="nom" [(ngModel)]="nom" required maxlength="80" />

    <label for="prix">Prix</label>
    <input id="prix" name="prix" type="number" [(ngModel)]="prix" min="0" step="0.01" required />

    <label for="dateCreation">Date de création</label>
    <input id="dateCreation" name="dateCreation" type="date" [(ngModel)]="dateCreation" required />

    <label for="plantType">Type</label>
    <select id="plantType" name="typeId" [(ngModel)]="typeId" required>
      @for (type of types; track type.id) {
        <option [ngValue]="type.id">{{ type.nom }}</option>
      }
    </select>

    <div class="actions">
      <button type="submit" [disabled]="!nom.trim() || prix === null || prix < 0">Ajouter</button>
      <a routerLink="/plantes">Annuler</a>
    </div>
  </form>
</main>
