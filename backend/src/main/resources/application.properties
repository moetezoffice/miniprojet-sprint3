server.port=${SERVER_PORT:8090}
server.servlet.context-path=/produits

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mes_plantes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:MesPlantes-Local-Only-Change-This-Secret-Key-2026}
app.jwt.issuer=mes-plantes-api
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origin=${ANGULAR_ORIGIN:http://localhost:4200}
app.demo.admin.username=${ADMIN_USERNAME:admin}
app.demo.admin.password=${ADMIN_PASSWORD:123}
app.demo.user.username=${USER_USERNAME:moetez}
app.demo.user.password=${USER_PASSWORD:123}
